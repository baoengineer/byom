[package]
name = "byom"
version = "0.4.2"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Bring your own model to Claude Code: every model you can sign in to, in the same session"
repository = "https://github.com/baoengineer/byom"
homepage = "https://github.com/baoengineer/byom"
readme = "README.md"
keywords = ["claude-code", "openai", "chatgpt", "gpt", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "tests/e2e/", "docs/demo/", "site/"]

[dependencies]
anyhow = "1"
base64 = "0.23"
sha2 = "0.11"
fs2 = "0.4"
jsonwebtoken = { version = "11.1", default-features = false, features = ["use_pem", "rust_crypto"] }
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", features = ["sink"] }
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
rpassword = "7.5.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
